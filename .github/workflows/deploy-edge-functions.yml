name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names (blank = deploy all)'
        required: false
        default: ''

jobs:
  deploy:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy repo-managed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: ./scripts/deploy-edge-functions.sh ${{ github.event.inputs.functions }}

      - name: Commit updated DEPLOYED.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/DEPLOYED.md
          git diff --staged --quiet || git commit -m "chore: auto-update DEPLOYED.md [skip ci]"
          git push
